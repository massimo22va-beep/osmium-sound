# Osmium Sound - Raspberry Pi 5 ARM64 bring-up profile
#
# Validated against the structure of upstream rpi-image-gen v2.8.0:
# https://github.com/raspberrypi/rpi-image-gen/blob/v2.8.0/config/trixie-minbase.yaml
# Pin: 262d4df5a9f9d4133370465399a7958a7c22cdc7
#
# This is an early boot-validation profile, not a release image.
# Do not add x86 GRUB, shim, or linux-image-amd64 packages here.

device:
  layer: rpi5
  storage_type: sd

image:
  layer: image-rpios
  boot_part_size: 200%
  root_part_size: 300%
  name: osmium-rpi5-arm64

layer:
  base: trixie-minbase

packages:
  - alsa-utils
  - squeezelite
  - curl
  - ca-certificates
